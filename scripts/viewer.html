<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Shared Browser</title>
  <link rel="stylesheet" href="/viewer.css">
</head>
<body>
  <header class="toolbar">
    <button class="icon-button" id="back" aria-label="Back">←</button>
    <button class="icon-button" id="forward" aria-label="Forward">→</button>
    <button class="icon-button" id="reload" aria-label="Reload">↻</button>
    <form id="url-form" class="url-form">
      <input id="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Address">
    </form>
    <select id="targets" aria-label="Browser tabs"></select>
  </header>

  <main id="screen" aria-label="Remote browser viewport">
    <div id="viewport">
      <canvas id="frame" tabindex="0"></canvas>
    </div>
    <div id="empty-state">
      <div class="spinner"></div>
      <strong>Connecting to Chrome</strong>
      <span>The session will resume automatically.</span>
    </div>
    <div id="status" class="status status-connecting">Connecting…</div>
    <div id="tap-dot"></div>
  </main>

  <footer class="controls">
    <button id="keyboard-button">⌨ <span>Keyboard</span></button>
    <button id="backspace" aria-label="Backspace">⌫</button>
    <button id="tab-key">Tab</button>
    <button id="enter-key">Enter</button>
    <button id="paste">Paste</button>
    <button id="fit">Fit</button>
    <button id="control" class="control-button">Take control</button>
    <button id="done" class="done-button">Done</button>
  </footer>

  <textarea id="keyboard-capture" aria-label="Remote keyboard input" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea>

  <dialog id="dialog">
    <form method="dialog">
      <h2 id="dialog-title">Browser message</h2>
      <p id="dialog-message"></p>
      <input id="dialog-prompt" autocomplete="off">
      <div class="dialog-actions">
        <button value="cancel" id="dialog-cancel">Cancel</button>
        <button value="accept" id="dialog-accept" class="primary">Continue</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/viewer.js"></script>
</body>
</html>
